name: nearlystop
description: >-
  An offline, account-free planner for an alternating-day steroid taper.
  No account, no server, no sync, no telemetry, zero network calls.
publish_to: 'none'

# The store-facing version. EPIC-15 owns bumping it.
version: 1.0.0+1

environment:
  # A real range so pub can solve; the exact tested toolchain is recorded in
  # .flutter-version, which CI reads (dependency-hygiene rule 4). The floor is
  # 3.10 because that is where dot-shorthands landed — below it the analyzer
  # rejects language the current stable toolchain emits.
  sdk: ^3.10.0

# Caret ranges only. pubspec.lock is the pin, and it is committed.
# Refused by policy, permanently: google_fonts, firebase_*, sentry_flutter, any
# analytics or crash SDK, http/dio, dynamic_color — each opens a network or a
# telemetry path in an app whose store listing will claim neither.
# tool/check_bans.sh and tool/audit-deps.sh make that refusal a gate.
dependencies:
  clock: ^1.1.1
  # Capped, deliberately. drift >=2.34.1 moved `GeneratedDatabase` onto the
  # drift3 preview API, and the newest drift_dev this Flutter SDK can resolve
  # (2.34.0 — 2.34.5 wants analyzer ^13, which `test` forbids) fails to compile
  # against it, taking `drift_dev schema dump` with it. 2.31.x is the newest
  # matched pair. Revisit when the SDK's analyzer floor moves.
  convert: ^3.1.2
  crypto: ^3.0.7
  drift: ">=2.31.0 <2.32.0"
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  # State + DI. lib/core/ and lib/data/ import `riverpod` directly; only the
  # widget layer uses `flutter_riverpod`. VGA's depend_on_referenced_packages
  # makes an undeclared import an analyzer error under --fatal-infos, so both
  # are declared.
  flutter_riverpod: ^3.0.0
  flutter_timezone: ^5.1.0
  go_router: ^17.0.0
  intl: ^0.20.2 # flutter_localizations pins intl exactly; a wider range will not resolve
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.0
  pdf: ^3.13.0
  printing: ^5.15.0
  riverpod: ^3.0.0
  # The Jalali calendar. A DEPENDENCY, not an exercise: the leap cycle has
  # irregular exceptions, and a hand-rolled converter is right for a year and
  # then quietly wrong somewhere inside a 780-day taper. Audited before adding:
  # pure Dart, and its `dependencies` block is EMPTY, so no network path is
  # reachable through it.
  shamsi_date: ^1.1.1
  # On the shipping path already via `package:drift/native.dart`; declared so
  # `_mapError` can name `SqliteException` without tripping
  # depend_on_referenced_packages.
  share_plus: ^13.3.0
  sqlite3: ">=2.4.6 <4.0.0"
  sqlite3_flutter_libs: ^0.5.0
  # A ULID per row, minted at insert. EPIC-13's backup format is built on stable
  # text ids — re-importing with autoincrement rowids duplicates everything —
  # and retrofitting them onto a database already holding a 400-day taper is the
  # migration this schema exists to avoid (CONTRACTS.md §11).
  timezone: ^0.11.1
  ulid: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.0
  # Grapheme-cluster counting, for the string-budget suite only: a Perso-Arabic
  # string carrying a combining mark overcounts by one on `String.length` and
  # would fail a budget the layout actually meets. TEST-only — declaring it
  # under `dependencies` misstates the set the store listing is audited against.
  characters: ^1.3.0
  csv: ^8.0.0
  drift_dev: ">=2.31.0 <2.32.0" # must match drift; see the note on it above
  # Fake time for the midnight-rollover suite. A rollover test that waits on a
  # real clock is a test nobody runs twice.
  fake_async: ^1.3.0
  # Icon and splash generation. Both DEV: they run once, write native assets
  # that are committed, and never ship in the binary.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  very_good_analysis: ^10.0.0
  # Parsing the Android manifest and `Info.plist` in the release policy test.
  # TEST-only, and deliberately so: an XML parser on the shipping compile path
  # would be a dependency the store audit has to explain, for a check that
  # never runs on a phone.
  xml: ^7.0.1

flutter:
  uses-material-design: true
  generate: true # gen-l10n; EPIC-03 adds l10n.yaml and the ARB files

  # Bundled, never fetched. google_fonts is refused by policy and by
  # tool/check_bans.sh: it ships an HTTP path in an app whose store listing
  # claims none. Both faces are single VARIABLE TTFs, so the weight axis is
  # reached through TextStyle.fontVariations rather than by declaring one asset
  # per weight — see lib/theme/daybreak_type.dart.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-VariableFont_wght.ttf

  # The OFL text ships too, and bootstrap() registers it: an unregistered OFL
  # font makes the app's own licenses page a lie.
  assets:
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-Vazirmatn.txt

# ------------------------------------------------------------------ branding
# Generated once, committed, and treated as codegen output: a regeneration
# that produces a diff is a review item. The source PNGs come from
# `test/branding/branding_assets_test.dart`, which renders them from the real
# Daybreak tokens — so the icon on the home screen is the same mark as the
# Welcome seal by construction, not by somebody matching a hex value.
flutter_launcher_icons:
  image_path: assets/branding/icon-1024.png

  android: true
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  # A flat layer, not an image: the launcher parallaxes the two against each
  # other, and a gradient that moves under a gradient reads as a smear.
  adaptive_icon_background: "#F9633F"
  # Android 13+ themed icons. Without it the launcher falls back to a
  # shrunken, washed-out version of the colour icon.
  adaptive_icon_monochrome: assets/branding/icon-monochrome.png

  ios: true
  # Apple REJECTS an alpha channel in the marketing icon. The generator writes
  # RGBA, so this flattens it onto the gradient rather than leaving the
  # rejection to be discovered at upload.
  remove_alpha_ios: true

flutter_native_splash:
  # Never white and never #000 — the launch ground is the app's own `bg`, so
  # there is nothing to flash between the splash and the first frame.
  color: "#FFF9F2"
  color_dark: "#241A20"
  image: assets/branding/splash-mark.png
  image_dark: assets/branding/splash-mark.png

  # The Android 12+ splash screen API is a different mechanism from the old
  # windowBackground drawable. Configuring only one of them is what produces
  # the double flash: the platform shows its own, then the app shows the
  # legacy one over it.
  android_12:
    color: "#FFF9F2"
    color_dark: "#241A20"
    image: assets/branding/splash-mark.png
    image_dark: assets/branding/splash-mark.png

  android: true
  ios: true
  web: false
