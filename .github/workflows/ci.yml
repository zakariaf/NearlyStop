name: ci

# Every job below maps to a named, release-blocking contract; the contract is
# stated in a comment above the step that enforces it. A check with no contract
# behind it is not a gate — it is gate-sprawl, and it does not belong here.
#
# WHAT THIS PIPELINE CANNOT PROVE, stated plainly so the manual pass stays
# load-bearing rather than becoming a chore:
#   * that the app makes ZERO NETWORK CALLS at runtime. CI proves no banned
#     import exists in the source graph. The airplane-mode check from a clean
#     install (SPEC §10) is a manual release artifact and EPIC-15 owns it.
#   * real-font rendering and on-device layout. Nunito and Vazirmatn shape
#     differently on a device than on a Linux runner.
#   * VoiceOver / TalkBack phrasing, and on-device notification delivery.
# A change touching any of those is not verified by a green run here.
#
# Also not proven here: that a real upgrade over a previously INSTALLED build
# works. There is no previous release to upgrade from at v1.0.0; the migration
# lane below exercises the ladder against a synthetic v2 fixture instead, and
# EPIC-15 records the install-and-upgrade check as a v1.1 gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04 # pinned, never -latest: image drift moves the toolchain with no diff to review
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # subosito/flutter-action's `flutter-version-file` parses STRUCTURED files
      # (pubspec.yaml's environment block, .fvmrc JSON). Our .flutter-version is
      # a bare version string, so read it here and pass `flutter-version`.
      - id: toolchain
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2 # v2 is current; there is no v3
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      - run: flutter --version
      # Contract: the committed pubspec.lock IS the pin. Without
      # --enforce-lockfile a constraint or SDK change lets pub silently
      # re-resolve, and CI then reports green over a version set nobody reviewed.
      - run: flutter pub get --enforce-lockfile

      # Contract: the lint ruleset is actually ON. A pinned `include:` naming a
      # file absent from the resolved package emits one warning and then runs
      # with zero added rules — a green build that checks nothing.
      - run: bash tool/verify_include_pin.sh

      # Contract: every gate below has been SEEN to fail. A gate that has only
      # ever been green is a comment. Each self-test asserts both arms.
      - run: bash tool/verify_include_pin_selftest.sh
      - run: bash tool/check_bans_selftest.sh
      - run: bash tool/check_core_purity_selftest.sh
      - run: bash tool/coverage_floor_selftest.sh
      - run: bash tool/check_raw_values_selftest.sh
      - run: bash tool/check_arb_parity_selftest.sh

      # Contract: the committed generated code IS the generated code. Without
      # this, a stale `.g.dart` compiles fine locally and diverges from
      # `tables.dart` silently — and the divergence surfaces as data loss on
      # someone's phone, not as a red test. Generated files are committed on
      # purpose: the alternative makes every clone run codegen before it can
      # run a test.
      - run: dart run build_runner build
      - name: generated code is up to date
        run: git diff --exit-code

      # Contract: the committed generated localizations ARE the ARB files. A
      # stale `lib/l10n/gen/` compiles and runs, serving yesterday's strings.
      - run: flutter gen-l10n
      - name: generated localizations are up to date
        run: git diff --exit-code -- lib/l10n/gen/

      # Contract: the schema dump, the migration ladder and the verifier
      # helpers all describe the SAME schema. `drift_dev schema dump` snapshots
      # whatever the code currently declares, so a table edited after the dump
      # was taken is a lie the ladder then carries forever.
      - run: dart run drift_dev schema dump lib/data/db/app_database.dart drift_schemas/
      - run: dart run drift_dev schema steps drift_schemas/ lib/data/db/schema_versions.dart
      - run: dart run drift_dev schema generate drift_schemas/ test/data/generated_migrations/
      - name: drift schema artefacts are up to date
        run: git diff --exit-code

      # Contract: whitespace is not a review topic.
      - run: dart format --output=none --set-exit-if-changed .

      # Contract: an info is a warning that will be ignored next week.
      - run: flutter analyze --fatal-infos --fatal-warnings

      # Contract: the offline / no-telemetry / RTL-by-construction / injected-clock
      # promises. These are properties of the SOURCE GRAPH; a passing test cannot
      # prove an import is absent, and a grep can.
      - run: bash tool/check_bans.sh

      # Contract: every locale carries exactly the template's keys, with the
      # same placeholders and the same ICU branch shapes. A missing key ships
      # English inside a German app and is invisible in review; a renamed
      # placeholder breaks that translation at RUNTIME.
      - run: bash tool/check_arb_parity.sh

      # Contract: lib/core/ stays pure Dart, so the domain is testable in
      # milliseconds without a widget harness (CONTRACTS.md §2).
      - run: bash tool/check_core_purity.sh

      # Contract: no junk-drawer folder, no barrel in the app package, no
      # MethodChannel outside services/native/.
      - run: bash tool/check_structure.sh

      # Contract: caret ranges, a committed lock, and nothing in the transitive
      # tree that opens a network or telemetry path.
      - run: bash tool/audit-deps.sh

      # REQUIRED before the suite: `flutter test --coverage` omits files no test
      # imports, so an untested file contributes zero DENOMINATOR lines and the
      # number lies upward. The generated file is gitignored.
      - run: bash tool/coverage_include_untested.sh

      # Contract: randomized ordering is free detection of inter-test state
      # leakage. Coverage is collected in the SAME run — never a second pass.
      #
      # `--exclude-tags golden` is deliberate, and it is an ADMITTED GAP rather
      # than a covered one: the reference PNGs were authored on macOS,
      # cross-OS rasterisation differs, and a gate that goes red for the host
      # instead of the code is a gate that gets switched off. **Nothing in CI
      # verifies those two PNGs.** EPIC-14 owns the pinned-runner golden sweep;
      # until then they are a local, human-reviewed check.
      #
      # `@Tags` is a LIBRARY-level annotation, so the claims the goldens
      # illustrate live in their own untagged files — which DO run here.
      - run: flutter test --coverage --test-randomize-ordering-seed random --exclude-tags "golden || migration" --reporter expanded

      # Contract: the upgrade ceremony works before an upgrade is needed. Its
      # own lane, because it opens real files, runs the generated ladder, and a
      # failure here means "the migration is broken" rather than "some test is
      # red".
      - run: flutter test --tags migration --reporter expanded

      # Contract: a calendar date is a calendar date in every timezone. Dart
      # cannot change the process's local zone in-process, so the only way to
      # prove LocalDate's DST claims is to re-run its suite under a second zone.
      # Europe/Berlin observes DST and is one hour east of UTC, which is exactly
      # where an accidental local-instant construction lands a day early.
      #
      # `test/app/` is in scope because the midnight ticker is the other place
      # a DST claim lives, and it is the one the user meets: on 2025-03-30 a
      # ticker built on UTC arithmetic reschedules an hour late. Verified by
      # planting exactly that — `DateTime.utc(...).difference(now.toUtc())`
      # passes under UTC and fails here.
      - run: TZ=Europe/Berlin flutter test test/core/time/ test/app/ --reporter expanded

      # The same argument one layer up, and the zone chosen by EXPERIMENT
      # rather than by intuition. The bug this catches is a UTC midnight read
      # back through local fields (`toUtcMidnight().toLocal()`), and that only
      # crosses a date boundary WEST of UTC: planted into date_formats.dart it
      # is invisible under both UTC and Pacific/Auckland — Auckland is UTC+12,
      # so a UTC midnight is still the same calendar day there — and fails four
      # assertions under America/Los_Angeles. The epic names Auckland; Auckland
      # cannot fail for this bug class, and a gate that cannot fail is a
      # comment.
      #
      # The assertions are absolute strings, so a zone-induced shift fails them
      # here rather than being diffed against the UTC run by hand.
      - run: TZ=America/Los_Angeles flutter test test/l10n/ --reporter expanded

      # Contract: the handful of files where a bug is unrecoverable stay at
      # their floor. Coverage as a whole is a published report, never a gate,
      # and there is deliberately no percentage threshold anywhere in this file.
      - run: bash tool/coverage_floor.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - id: toolchain
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.version }} # keep == verify's pin
          cache: true
      - run: flutter pub get --enforce-lockfile

      # Contract: the app still compiles for a real target. Unsigned on purpose
      # — no signing secret in this job means there is nothing here to leak.
      - run: flutter build apk --debug
