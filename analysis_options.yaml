# The lint safety net. See .claude/skills/lint-and-style-config.
#
# The include filename must EXIST in the RESOLVED very_good_analysis package. If
# it does not, analysis runs with zero added rules and the build is green while
# checking nothing. tool/verify_include_pin.sh is the gate for that; bump this
# filename in the same commit as any very_good_analysis bump.
include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  # This list is the ONE place the generated-code globs are written down.
  # tool/coverage_floor.sh parses it rather than retyping them: excludes and
  # coverage filters that drift apart lie the coverage number upward.
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.drift.dart'
    - lib/l10n/gen/**
    # `drift_dev schema generate` output: a frozen copy of each shipped schema,
    # regenerated wholesale and never hand-edited. Linting it would mean
    # editing it.
    - test/data/generated_migrations/**

  # Only silence-producing bug classes are promoted — never style preferences.
  # Every rule here is one very_good_analysis already enables, because `errors:`
  # re-ranks an existing diagnostic and cannot turn an off rule on.
  errors:
    unawaited_futures: error
    discarded_futures: error
    empty_catches: error
    use_build_context_synchronously: error
    cancel_subscriptions: error
    close_sinks: error # VGA ships this at `ignore`; re-promoted
    avoid_dynamic_calls: error
    exhaustive_cases: error
    avoid_print: error

# riverpod_lint is DEFERRED, not forgotten. Verified on Flutter 3.44.6 /
# Dart 3.12.2 / analyzer 12.1.0 against riverpod_lint 3.1.4:
#   * with `plugins: {riverpod_lint: ^3.0.0}` declared, a planted
#     avoid_public_notifier_properties violation produced NO diagnostic from
#     `flutter analyze --fatal-infos`, and
#   * `dart analyze <file>` never returned (killed at 4 min); with the block
#     removed the identical command returns in 0.56s.
# A plugin declaration that reports nothing and hangs the CLI analyzer is worse
# than none, so both the block and the dev_dependency are out until the
# protocol works end to end. Re-adding either is a deliberate act that must
# re-run the planted-violation check.
