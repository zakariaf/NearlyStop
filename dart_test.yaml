# Declared so `flutter test --exclude-tags golden` is a known tag rather than a
# typo the runner silently ignores.
tags:
  golden:
    # Reference PNGs authored on one host. CI excludes them: cross-OS
    # rasterisation differs, and a gate that goes red for the host instead of
    # the code is a gate that gets switched off. EPIC-14 owns the pinned-runner
    # golden sweep; until then these are a local, human-reviewed check.
    skip: false
  migration:
    # The schema-ladder lane. Its own tag so CI can run it separately from the
    # fast unit lane and a failure names the ceremony rather than "some test".
    skip: false
